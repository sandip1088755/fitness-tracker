<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Daily 1000</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="date" id="date"></p>
    <h1>Daily 1000</h1>
  </header>

  <section class="score-card">
    <div class="score"><span id="score">0</span><small>/ 1000 pts</small></div>
    <div class="bar"><div id="bar"></div></div>
    <p id="goalMsg" class="muted"></p>
  </section>

  <section class="stats">
    <div class="card"><span id="streak">0</span><small>Day streak</small></div>
    <div class="card"><span>1000</span><small>Daily goal</small></div>
  </section>

  <h2>Today's routine</h2>
  <ul id="tasks" class="tasks"></ul>

  <h2>Last 14 days</h2>
  <ul id="history" class="history"></ul>

  <script src="app.js"></script>
</body>
</html>
